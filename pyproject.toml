[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bondalyzer-paraview"
version = "0.1.0"
description = "Bondalyzer QTAIM visualization and conversion tools for VTK / ParaView and Trame"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "vtk>=9.0",
    "trame>=3.0",
    "trame-vuetify>=3.0",
    "trame-vtk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[tool.setuptools]
py-modules = [
    "plt_zone0_to_vtk",
    "plt_1d_to_vtm",
    "plt_gba_to_vtm",
    "inspect_plt",
    "inspect_plt2",
    "trame_viewer",
    "verify_paraview_molecule",
    "check_env",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "gudhi>=3.13.0",
    "networkx>=3.4.2",
    "pyvista>=0.49.0",
    "rich>=15.0.0",
    "cyclopts>=4.25.3",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "vtk.*",
    "vtkmodules.*",
    "trame.*",
    "trame_vuetify.*",
    "trame_vtk.*",
    "pyvista.*",
    "gudhi.*",
]
ignore_missing_imports = true
